name: loni
scheduler: slurm
# Scheduler profile schema is identical to an InterfaceForge profile, so the
# same file can drive both tools. Replace YOUR_LONI_ACCOUNT and the module /
# binary names for your cluster.
#
# Recognised command tokens: {nodes} {ntasks} {cpus_per_task} {gpus}

jobs:
  # ---- one WAVECAR SCF per snapshot (inamd waverun) ----
  vasp_nac:
    partition: checkpt
    account: YOUR_LONI_ACCOUNT
    nodes: 2
    ntasks: 128
    cpus_per_task: 1
    time: "72:00:00"
    modules: [vasp6/6.3.1-cpu]
    environment: {OMP_NUM_THREADS: "1"}
    # Iterated over a snapshot range by inamd; runs inside each NNN/ folder.
    command: "srun -n {ntasks} vasp_gam"

  # ---- CA-NAC non-adiabatic couplings (inamd nac run) ----
  canac:
    partition: workq
    account: YOUR_LONI_ACCOUNT
    nodes: 1
    ntasks: 48
    cpus_per_task: 1
    time: "24:00:00"
    modules: []
    preamble: ['if [[ -n "${CANAC_ACTIVATE_SCRIPT:-}" ]]; then source "${CANAC_ACTIVATE_SCRIPT}"; fi']
    environment: {OMP_NUM_THREADS: "1"}
    command: "python input.py"

  # ---- Hefei-NAMD surface hopping (inamd hefei launch) ----
  hefei_namd:
    partition: workq
    account: YOUR_LONI_ACCOUNT
    nodes: 1
    ntasks: 48
    cpus_per_task: 1
    time: "72:00:00"
    modules: [mpich/4.0.2/intel-19.0.5]
    environment: {OMP_NUM_THREADS: "1"}
    # Leave command unset so `namd.branch` + `namd.algo` select hfnamd/dish/namd.
    # Set a full command only when the cluster environment requires an override.

  # ---- serial post-processing (dephase / inicon / shprop / ksplot) ----
  analysis:
    partition: single
    account: YOUR_LONI_ACCOUNT
    nodes: 1
    ntasks: 1
    cpus_per_task: 1
    time: "06:00:00"
    modules: []
    environment: {OMP_NUM_THREADS: "1"}
    command: "bash run_analysis.sh"
